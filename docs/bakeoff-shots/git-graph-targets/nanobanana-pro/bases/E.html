<!doctype html><html><head><meta charset=utf-8>
<style>html,body{margin:0;background:#0E0E0D} svg{display:block;width:1400px;height:auto}</style>
</head><body><svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="380" fill="#121211"/>
  <line x1="120" y1="30" x2="120" y2="350" stroke="#C8C4B8" stroke-width="3"/>
  <circle cx="120" cy="50" r="6" fill="#C8C4B8"/>
  <text x="140" y="54" fill="#A5A096" font-size="12" font-family="ui-monospace,Menlo,monospace">MAIN</text>

  <!-- worktrees stacked on same visual "family" but offset -->
  <path d="M120,90 H200" stroke="#E0A94A" stroke-width="3" fill="none"/>
  <line x1="200" y1="90" x2="200" y2="300" stroke="#E0A94A" stroke-width="3"/>
  <circle cx="200" cy="90" r="7" fill="#E0A94A"/>
  <text x="220" y="94" fill="#EDEAE3" font-size="13" font-family="ui-monospace,Menlo,monospace">WORKTREE broll-unit</text>

  <!-- sidecar AB win: small vertical then back -->
  <rect x="248" y="120" width="90" height="110" rx="8" fill="#1A1814" stroke="#3A3428"/>
  <text x="258" y="138" fill="#C4A35A" font-size="10" font-family="ui-monospace,Menlo,monospace">A/B sidecar</text>
  <line x1="290" y1="150" x2="290" y2="210" stroke="#C4A35A" stroke-width="2.5"/>
  <circle cx="290" cy="155" r="4" fill="#C4A35A"/>
  <circle cx="290" cy="185" r="4" fill="#C4A35A"/>
  <path d="M290,210 Q250,220 200,220" fill="none" stroke="#8FB04A" stroke-width="2.5"/>
  <circle cx="200" cy="220" r="6" fill="#8FB04A"/>
  <text x="348" y="190" fill="#8FB04A" font-size="11" font-family="ui-monospace,Menlo,monospace">merge</text>

  <!-- sidecar dead -->
  <rect x="248" y="240" width="90" height="70" rx="8" fill="#181616" stroke="#333"/>
  <line x1="290" y1="255" x2="290" y2="290" stroke="#6E6A62" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="290" cy="290" r="5" fill="none" stroke="#E0654A" stroke-width="1.5"/>
  <text x="348" y="275" fill="#6E6A62" font-size="11" font-family="ui-monospace,Menlo,monospace">DEAD</text>

  <!-- second worktree -->
  <path d="M120,110 H480" stroke="#6E9BD6" stroke-width="3" fill="none"/>
  <line x1="480" y1="110" x2="480" y2="300" stroke="#6E9BD6" stroke-width="3"/>
  <circle cx="480" cy="110" r="7" fill="#6E9BD6"/>
  <text x="500" y="114" fill="#EDEAE3" font-size="13" font-family="ui-monospace,Menlo,monospace">WORKTREE reel-covers</text>
  <rect x="528" y="150" width="90" height="90" rx="8" fill="#141820" stroke="#2A3545"/>
  <line x1="570" y1="170" x2="570" y2="220" stroke="#8AA8D0" stroke-width="2.5"/>
  <circle cx="570" cy="175" r="4" fill="#8AA8D0"/>
  <circle cx="570" cy="210" r="4" fill="#8AA8D0"/>
  <text x="628" y="200" fill="#8AA8D0" font-size="11" font-family="ui-monospace,Menlo,monospace">A/B open</text>
</svg></body></html>
